name: Reproduce A-G
on:
  push:
    paths:
      - 'experiments/**'
      - 'tests/**'
      - 'data/**'
      - 'reproduce_all.py'
      - '.github/workflows/reproducibility.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'smoke (fast) or full (all seven experiments)'
        required: true
        type: choice
        options: [smoke, full]
        default: smoke
jobs:
  reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies in clean runner
        run: python -m pip install -r requirements.txt
      - name: Run reproducibility suite
        run: python reproduce_all.py --mode ${{ github.event.inputs.mode || 'smoke' }}
      - name: Archive logs, figures, tables and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repro-${{ github.event.inputs.mode || 'smoke' }}-${{ github.run_number }}
          path: outputs/
          retention-days: 30
